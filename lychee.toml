# Some security vendors answer automated clients with 403 or 429 while the page works in a browser.
accept = ["200..=299", "429"]
max_retries = 3
retry_wait_time = 10
timeout = 30
user_agent = "Mozilla/5.0 (compatible; link-check; +https://github.com/nukoe-labs/awesome-coding-agent-security)"
# These pages need a signed-in GitHub session and always answer 404 to anonymous clients.
exclude = [
  "^https://github.com/settings/",
  "^https://github.com/nukoe-labs/awesome-coding-agent-security/security/advisories/new",
]
