name: Dead link or wrong fact
description: Report a broken link, an outdated version or an incorrect fact.
labels: [fix]
body:
  - type: input
    id: entry
    attributes:
      label: Entry
      description: Name of the entry as it appears in the list.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: Include the source that shows the correct fact.
    validations:
      required: true
